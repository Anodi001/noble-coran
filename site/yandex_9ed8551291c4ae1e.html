  // Calcule la fenêtre temporelle [t0, t1] (en secondes) de chaque mot pour le seek YouTube
  function calculerFenetresMots(dureeAudio) {
    var n = cacheMetaCartes.length;
    if (n === 0 || !dureeAudio || !isFinite(dureeAudio) || dureeAudio <= 0) return [];

    // Utilise les timestamps QDC exacts si disponibles
    var segs = window.__wbwSegsActuels;
    if (segs && segs.length > 0) {
      var fenetresQdc = new Array(n);
      for (var s = 0; s < segs.length; s++) {
        var sg = segs[s];
        if (sg && sg.length >= 3) {
          var wIdx = Number(sg[0]) - 1;
          if (wIdx >= 0 && wIdx < n) {
            fenetresQdc[wIdx] = { t0: Number(sg[1]) / 1000, t1: Number(sg[2]) / 1000 };
          }
        }
      }
      var tousPresents = true;
      for (var k = 0; k < n; k++) {
        if (!fenetresQdc[k]) { tousPresents = false; break; }
      }
      if (tousPresents) return fenetresQdc;
    }

    // Répartition pondérée par la longueur arabe de chaque mot
    var poids = new Array(n);
    var totalPoids = 0;
    for (var i = 0; i < n; i++) {
      var m = cacheMetaCartes[i];
      var arTxt = m && m.elAr ? nettoyerArabeBrut(m.elAr.textContent || '') : '';
      var p = Math.max(2.2, arTxt.length * 1.15);
      poids[i] = p;
      totalPoids += p;
    }

    var cumul = 0;
    var fenetres = new Array(n);
    var dureeUtile = Math.max(0.2, dureeAudio * 0.96);
    for (var j = 0; j < n; j++) {
      var dMot = (poids[j] / totalPoids) * dureeUtile;
      fenetres[j] = { t0: cumul, t1: cumul + dMot };
      cumul += dMot;
    }
    return fenetres;
  }

  function detecterSensLectureGrille() {

  function chercherTempsDepuisScrub(idxMot, clientX, wrapEl) {
    if (idxMot < 0 || idxMot >= cacheMetaCartes.length || !wrapEl) return;
    var rect = wrapEl.getBoundingClientRect();
    if (rect.width <= 0) return;

    var dir = detecterSensLectureGrille();
    var xRel = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    var ratioMot = dir === 'rtl' ? (1 - xRel) : xRel;

    idxMotScrub = idxMot;
    ratioInterneScrub = ratioMot;
    maxIdxAtteintVerset = idxMot;

    var aud = document.getElementById('ayahAudio') || window.__lecteurAudioActuel || document.querySelector('audio');
    if (!aud) return;

    var lancerEtPositionner = function() {
      var dur = aud.duration;
      if (dur && isFinite(dur) && dur > 0) {
        var fen = calculerFenetresMots(dur);
        if (fen[idxMot]) {
          aud.currentTime = Math.max(0, Math.min(dur - 0.05, fen[idxMot].t0 + ratioMot * (fen[idxMot].t1 - fen[idxMot].t0)));
        } else {
          aud.currentTime = ((idxMot + ratioMot) / cacheMetaCartes.length) * dur;
        }
      }
    };

    if (!aud.src || aud.readyState === 0) {
      var playBtn = document.getElementById('playSyncBtn');
      if (playBtn && aud.paused) playBtn.click();
      aud.addEventListener('loadedmetadata', function onMeta() {
        aud.removeEventListener('loadedmetadata', onMeta);
        lancerEtPositionner();
      });
    } else {
      lancerEtPositionner();

        var playBtn2 = document.getElementById('playSyncBtn');

  }

      carte.classList.add('wbw-card-v110');

      forcer(carte, 'margin', '0px');
      forcer(carte, 'padding', '2px 8px 4px 8px');
      forcer(carte, 'background', 'transparent');
      forcer(carte, 'border', 'none');
      forcer(carte, 'border-radius', '0px');
      forcer(carte, 'box-shadow', 'none');
      forcer(carte, 'outline', 'none');
      forcer(carte, 'min-width', '0px');
      forcer(carte, 'width', 'auto');
      forcer(carte, 'height', 'auto');
      forcer(carte, 'display', 'inline-flex');
      forcer(carte, 'flex-direction', 'column');
      forcer(carte, 'align-items', 'center');
      forcer(carte, 'justify-content', 'flex-start');
      forcer(carte, 'transform', 'none');

      var elAr = null;
      var elTrad = null;

      var directs = carte.children;
      for (var d = 0; d < directs.length; d++) {
        var ch = directs[d];
        if (ch.classList.contains('wbw-scrub-wrap')) continue;
        var tCh = (ch.textContent || '').trim();
        if (estPetitNumero(tCh) || ch.tagName === 'SUP' || ch.tagName === 'SMALL') {
          detruireNoeudNumero(ch);
        } else if (!elAr && (ch.classList.contains('wbw-ar') || ch.classList.contains('wbw-ar-v110') || contientArabe(tCh))) {
          elAr = ch;
        } else if (ch !== elAr && (ch.classList.contains('wbw-tr') || ch.classList.contains('wbw-tr-v110') || tCh.length > 0)) {
          elTrad = ch;
        }
      }

      if (elAr) {
        elAr.classList.remove('wbw-num-hidden-v110', 'wbw-num-hidden-v111', 'wbw-num-hidden-v112');
        delete elAr.dataset.wbwIsNum;
        elAr.classList.add('wbw-ar-v110');
        forcer(elAr, 'display', 'block');
        forcer(elAr, 'visibility', 'visible');
        forcer(elAr, 'opacity', '1');
        forcer(elAr, 'min-height', hRem);
        forcer(elAr, 'line-height', hRem);
        forcer(elAr, 'text-align', 'center');
        forcer(elAr, 'font-size', arFont);
        forcer(elAr, 'white-space', 'nowrap');
      }
      if (elTrad) {
        elTrad.classList.remove('wbw-num-hidden-v110', 'wbw-num-hidden-v111', 'wbw-num-hidden-v112');
        delete elTrad.dataset.wbwIsNum;
        elTrad.classList.add('wbw-tr-v110');
        forcer(elTrad, 'display', 'block');
        forcer(elTrad, 'visibility', 'visible');
        forcer(elTrad, 'opacity', '1');
        forcer(elTrad, 'width', 'auto');
        forcer(elTrad, 'height', 'auto');
        forcer(elTrad, 'max-width', cartes.length === 1 ? '220px' : trMaxW);
        forcer(elTrad, 'text-align', 'center');
        forcer(elTrad, 'line-height', '1.25');
        forcer(elTrad, 'font-size', trFont);
        forcer(elTrad, 'margin-top', '4px');
        nettoyerEtTraduireMotUneFois(elTrad, elAr, lang);
      }

      var scrubObj = creerBarreScrubPourCarte(carte, m);
      purgerTousLesChiffresDeLaCarte(carte, elAr, elTrad);

      cacheMetaCartes[m] = {
        carte: carte,
        elAr: elAr,
        elTrad: elTrad,
        scrub: scrubObj,
        lastE: -1,
        lastB: -1,
        lastContraste: -1
      };
    }

    return true;
  }

  window.__appliquerRubanColleWBW = function(ts) {
    var maintenant = (typeof ts === 'number' && ts > 0) ? ts : performance.now();
    var dt = dernierTimestampRaf ? Math.min(50, Math.max(1, maintenant - dernierTimestampRaf)) : (1000 / 60);
    dernierTimestampRaf = maintenant;

    var alphaE = 1 - Math.pow(1 - 0.32, dt / (1000 / 60));
    var alphaB = 1 - Math.pow(1 - 0.26, dt / (1000 / 60));
    var alphaC = 1 - Math.pow(1 - 0.25, dt / (1000 / 60));

    var aud = document.getElementById('ayahAudio') || window.__lecteurAudioActuel || document.querySelector('audio');
    var tActuel = aud ? (aud.currentTime || 0) : 0;
    var durAudio = (aud && aud.duration && isFinite(aud.duration)) ? aud.duration : 0;
    var audioJoue = Boolean(aud && !aud.paused && !aud.ended);

    var cartes = obtenirCartesMotAMotUniversel();
    var banner = document.getElementById('wbwSensLectureBanner');

    if (!cartes || cartes.length < 1) {
      if (banner) forcer(banner, 'display', 'none');
      gererMasquageDoublonVerset(null, false);
      return;
    }

    if (!preparerGrilleSiNecessaire(cartes)) {
      if (banner) forcer(banner, 'display', 'none');
      return;
    }

    var suiviBoutonOn = window.__wbwSuiviBoutonActif !== false;
    var energies = (suiviBoutonOn && audioJoue) ? (window.__wbwEnergies || []) : [];

    var idxPic = -1;
    var maxValE = 0.50;
    if (idxMotScrub >= 0) {
      idxPic = idxMotScrub;
    } else if (audioJoue) {
      for (var p = 0; p < cartes.length; p++) {
        var ev = energies[p] || 0;
        if (ev > maxValE) {
          maxValE = ev;
          idxPic = p;
        }
      }
      if (idxPic === -1 && tActuel < 0.45) {
        idxPic = 0;
      }
    }

    if (window.__wbwResetDemande || (tActuel < 0.15 && dernierTempsAudio > 0.4 && idxMotScrub === -1) || (!audioJoue && tActuel < 0.08 && (!aud || !aud.ended) && idxMotScrub === -1)) {
      window.__wbwResetDemande = false;
      maxIdxAtteintVerset = -1;
      idxMotEnCoursCache = -1;
      for (var r = 0; r < cartes.length; r++) {
        lissageE[r] = 0;
        lissageB[r] = 0;
        if (cacheMetaCartes[r]) {
          cacheMetaCartes[r].lastE = -1;
          cacheMetaCartes[r].lastB = -1;
        }
      }
    }
    dernierTempsAudio = tActuel;

    if (suiviBoutonOn && (audioJoue || idxMotScrub >= 0) && idxPic >= 0) {
      if (idxMotScrub >= 0) {
        maxIdxAtteintVerset = idxPic;
      } else if (idxPic <= maxIdxAtteintVerset + 1) {
        if (idxPic > maxIdxAtteintVerset) maxIdxAtteintVerset = idxPic;
      } else if (tActuel > 1.2) {
        maxIdxAtteintVerset = idxPic;
      }
    }
    if (suiviBoutonOn && aud && aud.ended) {
      maxIdxAtteintVerset = cartes.length - 1;
    }

    var idxActuel = idxPic >= 0 ? idxPic : maxIdxAtteintVerset;
    if (idxActuel !== idxMotEnCoursCache) {
      idxMotEnCoursCache = idxActuel;
      debutTempsMotActuel = maintenant;
    }

    // Progression interne fluide (0% -> 100%) sur le segment du mot en cours
    var ratioMotActuel = 0.5;
    if (idxMotScrub >= 0) {
      ratioMotActuel = Math.max(0.08, Math.min(1, ratioInterneScrub));
    } else if (audioJoue && idxActuel >= 0) {
      var dureeMoyMotMs = durAudio > 0 ? Math.max(260, (durAudio * 920) / Math.max(1, cartes.length)) : 650;
      ratioMotActuel = Math.max(0.12, Math.min(0.96, (maintenant - debutTempsMotActuel) / dureeMoyMotMs));
    } else if (aud && aud.ended) {
      ratioMotActuel = 1.0;
    }

    var dirLecture = detecterSensLectureGrille();
    var audioActif = Boolean(suiviBoutonOn && (audioJoue || maxIdxAtteintVerset >= 0));
    var cibleContraste = audioActif ? 1.0 : 0.0;
    modeContrasteSuivi += (cibleContraste - modeContrasteSuivi) * alphaC;

    for (var m = 0; m < cacheMetaCartes.length; m++) {
      var meta = cacheMetaCartes[m];
      if (!meta || !meta.carte) continue;

      if (!meta.elAr || !meta.elAr.isConnected) {
        derniereSigPreparation = '';
        preparerGrilleSiNecessaire(cartes);
        meta = cacheMetaCartes[m];
        if (!meta || !meta.carte) continue;
      }

      purgerTousLesChiffresDeLaCarte(meta.carte, meta.elAr, meta.elTrad);

      var estMotActuel = suiviBoutonOn && (audioJoue || idxMotScrub >= 0) && (m === idxActuel || (cartes.length === 1 && (!aud || !aud.ended)));
      var estDejaLu = suiviBoutonOn && (m < idxActuel || (aud && aud.ended));
      var distanceFutur = idxActuel >= 0 ? (m - idxActuel) : (m + 1);

      var eBrut = estMotActuel ? 1.0 : (audioJoue ? (energies[m] || 0) : 0);
      var bBrut = (estDejaLu || estMotActuel) ? 1.0 : 0.0;

      lissageE[m] += (eBrut - lissageE[m]) * alphaE;
      lissageB[m] += (bBrut - lissageB[m]) * alphaB;
      if (lissageE[m] < 0.002) lissageE[m] = 0;
      if (lissageB[m] < 0.002) lissageB[m] = 0;

      var e = courbeAppleMusic(lissageE[m]);
      var b = courbeAppleMusic(lissageB[m]);

      // Mise à jour de la ligne de progression style YouTube au-dessus du mot
      if (meta.scrub && meta.scrub.wrap && meta.scrub.fill && meta.scrub.track) {
        if (meta.scrub.wrap.getAttribute('data-dir') !== dirLecture) {
          meta.scrub.wrap.setAttribute('data-dir', dirLecture);
        }
        var pctFill = 0;
        if (estDejaLu) {
          pctFill = 100;
        } else if (estMotActuel) {
          pctFill = Math.round(ratioMotActuel * 100);
        }
        forcer(meta.scrub.fill, 'width', pctFill + '%');

        if (estMotActuel) {
          meta.scrub.wrap.classList.add('wbw-scrub-active');
          forcer(meta.scrub.track, 'background', 'rgba(186, 230, 253, 0.38)');
          forcer(meta.scrub.track, 'opacity', '1');
        } else {
          meta.scrub.wrap.classList.remove('wbw-scrub-active');
          if (estDejaLu) {
            forcer(meta.scrub.track, 'background', 'rgba(56, 189, 248, 0.28)');
            forcer(meta.scrub.track, 'opacity', '0.95');
          } else if (audioActif && distanceFutur === 1) {
            // Prochain mot qu'on va entendre (+1) : opacité plus vive
            forcer(meta.scrub.track, 'background', 'rgba(186, 230, 253, 0.34)');
            forcer(meta.scrub.track, 'opacity', '0.68');
          } else if (audioActif && distanceFutur === 2) {
            // Deuxième mot à venir (+2) : opacité intermédiaire
            forcer(meta.scrub.track, 'background', 'rgba(148, 163, 184, 0.26)');
            forcer(meta.scrub.track, 'opacity', '0.45');
          } else {
            forcer(meta.scrub.track, 'background', 'rgba(148, 163, 184, 0.18)');
            forcer(meta.scrub.track, 'opacity', audioActif ? '0.24' : '0.42');
          }
        }
      }

      var lum = Math.max(b, e);
      // Opacité graduée pour les mots qu'on va prochainement entendre (+1 et +2)
      var opReposBase = 0.96 - 0.54 * modeContrasteSuivi;
      if (audioActif && !estDejaLu && !estMotActuel) {
        if (distanceFutur === 1) opReposBase = Math.max(opReposBase, 0.72);
        else if (distanceFutur === 2) opReposBase = Math.max(opReposBase, 0.56);
      }
      var opMot = (opReposBase + (1.0 - opReposBase) * lum).toFixed(3);

      var yPx = (-6.5 * e).toFixed(2);
      var sc = (1.0 + 0.11 * e).toFixed(3);
      var transMot = 'translate3d(0px, ' + yPx + 'px, 0px) scale(' + sc + ')';

      if (meta.elAr) {
        var ombreAr = 'none';
        if (e > 0.015 || b > 0.02) {
          var rBlanc = (10 + 12 * e + 4 * b).toFixed(1);
          var aBlanc = (0.68 * b + 0.30 * e).toFixed(3);
          var rGlace = (20 + 18 * e + 8 * b).toFixed(1);
          var aGlace = (0.36 * b + 0.44 * e).toFixed(3);
          ombreAr = '0 0 ' + rBlanc + 'px rgba(255, 255, 255, ' + aBlanc + '), 0 0 ' + rGlace + 'px rgba(186, 230, 253, ' + aGlace + ')';
        } else if (modeContrasteSuivi < 0.2) {
          ombreAr = '0 0 8px rgba(255, 255, 255, 0.14)';
        }

        forcer(meta.elAr, 'opacity', opMot);
        forcer(meta.elAr, 'transform', transMot);
        forcer(meta.elAr, 'color', '#f8fafc');
        forcer(meta.elAr, 'text-shadow', ombreAr);
      }

      if (meta.elTrad) {
        var colTrRepos = melangerRGB(186, 230, 253, 148, 163, 184, modeContrasteSuivi);
        var colTrFinal = lum > 0.01 ? melangerRGB(148, 163, 184, 255, 255, 255, lum) : colTrRepos;
        var ombreTr = (e > 0.02 || b > 0.08)
          ? ('0 0 ' + (10 * e + 5 * b).toFixed(1) + 'px rgba(255, 255, 255, ' + (0.55 * e + 0.28 * b).toFixed(3) + ')')
          : 'none';
        forcer(meta.elTrad, 'opacity', opMot);
        forcer(meta.elTrad, 'transform', transMot);
        forcer(meta.elTrad, 'color', colTrFinal);
        forcer(meta.elTrad, 'font-weight', e > 0.25 ? '600' : (b > 0.5 ? '500' : '400'));
        forcer(meta.elTrad, 'text-shadow', ombreTr);
      }
    }
  };

  function verifierChangementVersetEtPause() {
    initialiserModesSurSourate();
    masquerBlocProgressionSurSourate();

    var cleActuelle = obtenirCleVersetActuelDom();
    if (cleActuelle && derniereCleVersetVue && cleActuelle !== derniereCleVersetVue) {
      derniereCleVersetVue = cleActuelle;
      derniereSigPreparation = '';
      maxIdxAtteintVerset = -1;
      idxMotEnCoursCache = -1;
      modeContrasteSuivi = 0;
      window.__wbwEnergies = [];
      window.__wbwBleus = [];
      gererMasquageDoublonVerset(null, false);
    } else if (cleActuelle) {
      derniereCleVersetVue = cleActuelle;
    }

    if (window.__appliquerRubanColleWBW) {
      window.__appliquerRubanColleWBW();
    }
  }

  setInterval(verifierChangementVersetEtPause, 180);

  document.addEventListener('click', function() {
    setTimeout(verifierChangementVersetEtPause, 20);
    setTimeout(verifierChangementVersetEtPause, 90);
  });
  document.addEventListener('change', function() {
    setTimeout(verifierChangementVersetEtPause, 20);
    setTimeout(verifierChangementVersetEtPause, 90);
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', verifierChangementVersetEtPause);
  } else {
    verifierChangementVersetEtPause();
  }
})();
</script>
