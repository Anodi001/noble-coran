    <body>Verification: 9ed8551291c4ae1e<!-- WBW_COLLE_V88_START -->

<style id="wbw-style-v88">
  .wbw-grid-v88 {
    gap: 0px !important;
    column-gap: 0px !important;
    row-gap: 14px !important;
  }
  .wbw-card-v88 {
    background: transparent !important;
    border-top: none !important;
    border-left: none !important;
    border-right: none !important;
    border-radius: 0px !important;
    box-shadow: none !important;
    margin: 0px !important;
  }
</style>
<script id="wbw-colle-v88">
(function() {
  function forcerStyle(el, prop, val) {
    if (el && el.style && el.style.getPropertyValue(prop) !== val) {
      el.style.setProperty(prop, val, 'important');
    }
  }

  // Vérifie sans aucune regex si le texte est uniquement un entier entre 1 et 400 (ex: "1", "2", "14")
  function estNumeroMotPur(str) {
    var s = (str || '').trim();
    if (s.length < 1 || s.length > 3) return false;
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      if (code < 48 || code > 57) return false;
    }
    var num = parseInt(s, 10);
    return num >= 1 && num <= 400;
  }

  // Vérifie sans regex si le texte contient des lettres arabes
  function contientTexteArabe(str) {
    var s = str || '';
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      if (code >= 1536 && code <= 1791) return true;
    }
    return false;
  }

  function souderMotsSansRectangles() {
    var tousLesElements = document.querySelectorAll('span, div, small, sup, b, p');
    var grillesTraitees = [];

    for (var i = 0; i < tousLesElements.length; i++) {
      var elNum = tousLesElements[i];
      if (elNum.children.length !== 0) continue;
      if (!estNumeroMotPur(elNum.textContent)) continue;

      var carte = elNum.parentElement;
      if (!carte || carte.children.length < 2 || carte.children.length > 5) continue;
      if (carte.offsetWidth > 380 || carte.offsetHeight > 260) continue;
      if (!contientTexteArabe(carte.textContent)) continue;

      var grille = carte.parentElement;
      if (!grille) continue;

      // 1. Style du grand conteneur unique (rassemble tous les mots sans espace horizontal)
      if (grillesTraitees.indexOf(grille) === -1) {
        grillesTraitees.push(grille);
        grille.classList.add('wbw-grid-v88');
        forcerStyle(grille, 'display', 'flex');
        forcerStyle(grille, 'flex-wrap', 'wrap');
        forcerStyle(grille, 'justify-content', 'center');
        forcerStyle(grille, 'align-items', 'stretch');
        forcerStyle(grille, 'gap', '0px');
        forcerStyle(grille, 'column-gap', '0px');
        forcerStyle(grille, 'row-gap', '14px');
        forcerStyle(grille, 'padding', '18px 14px');
        forcerStyle(grille, 'background', 'rgba(8, 19, 36, 0.72)');
        forcerStyle(grille, 'border', '1px solid rgba(56, 189, 248, 0.22)');
        forcerStyle(grille, 'border-radius', '18px');
      }

      // 2. Identification du mot arabe et de la traduction dans la carte
      var elAr = null;
      var elTrad = null;
      for (var k = 0; k < carte.children.length; k++) {
        var enf = carte.children[k];
        if (enf === elNum) continue;
        if (!elAr && contientTexteArabe(enf.textContent)) {
          elAr = enf;
        } else {
          elTrad = enf;
        }
      }
      if (!elAr) continue;

      // 3. Détection de l'illumination du mode Suivi (Follow) sur le mot arabe
      var styleArInline = elAr.getAttribute('style') || '';
      var styleCompAr = window.getComputedStyle(elAr);
      var ombreAr = (styleCompAr.textShadow || '') + ' ' + styleArInline;
      var couleurAr = (styleCompAr.color || '') + ' ' + styleArInline;

      // Dans reinitialiserMotsEnBlancTamise, le repos a l'ombre "rgba(255, 255, 255, 0.14)"
      var estMotEnLecture =
        ombreAr.indexOf('56, 189, 248') !== -1 ||
        ombreAr.indexOf('0, 210, 255') !== -1 ||
        ombreAr.indexOf('38bdf8') !== -1 ||
        couleurAr.indexOf('56, 189, 248') !== -1 ||
        couleurAr.indexOf('38bdf8') !== -1 ||
        (styleArInline.indexOf('text-shadow') !== -1 && styleArInline.indexOf('0.14') === -1);

      // 4. Suppression totale du rectangle/carré autour du mot et collage aux mots voisins
      carte.classList.add('wbw-card-v88');
      forcerStyle(carte, 'margin', '0px');
      forcerStyle(carte, 'border-top', 'none');
      forcerStyle(carte, 'border-left', 'none');
      forcerStyle(carte, 'border-right', 'none');
      forcerStyle(carte, 'border-radius', '0px');
      forcerStyle(carte, 'box-shadow', 'none');
      forcerStyle(carte, 'outline', 'none');
      forcerStyle(carte, 'padding', '6px 10px 8px 10px');
      forcerStyle(carte, 'min-width', '0px');
      forcerStyle(carte, 'width', 'auto');
      forcerStyle(carte, 'transform', 'none');

      if (estMotEnLecture) {
        forcerStyle(carte, 'background', 'radial-gradient(ellipse at center, rgba(56, 189, 248, 0.24) 0%, rgba(56, 189, 248, 0) 75%)');
        forcerStyle(carte, 'border-bottom', '2.5px solid #38bdf8');
        if (elTrad) {
          forcerStyle(elTrad, 'color', '#38bdf8');
          forcerStyle(elTrad, 'font-weight', '600');
          forcerStyle(elTrad, 'text-shadow', '0 0 10px rgba(56, 189, 248, 0.75)');
        }
      } else {
        forcerStyle(carte, 'background', 'transparent');
        forcerStyle(carte, 'border-bottom', '1px solid rgba(56, 189, 248, 0.14)');
        if (elTrad) {
          forcerStyle(elTrad, 'color', '#94a3b8');
          forcerStyle(elTrad, 'font-weight', '400');
          forcerStyle(elTrad, 'text-shadow', 'none');
        }
      }

      forcerStyle(elNum, 'font-size', '0.6rem');
      forcerStyle(elNum, 'opacity', estMotEnLecture ? '0.9' : '0.25');

      if (elTrad) {
        forcerStyle(elTrad, 'max-width', '115px');
        forcerStyle(elTrad, 'text-align', 'center');
        forcerStyle(elTrad, 'line-height', '1.22');
      }
    }
  }

  setInterval(souderMotsSansRectangles, 45);
  document.addEventListener('click', function() {
    setTimeout(souderMotsSansRectangles, 10);
  });
})();
</script>
<!-- WBW_COLLE_V88_END -->
</body>
